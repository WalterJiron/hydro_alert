name: hydro_alert
description: "HydroAlert: alertas sísmicas, meteorológicas y reportes comunitarios para Nicaragua."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: 5.11.1
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter_riverpod: 3.2.1
  flutter_animate: ^4.5.2
  freezed_annotation: 3.1.0
  geolocator: 14.1.2
  go_router: 18.1.3
  image_picker: 1.2.4
  intl: ^0.20.2
  json_annotation: 4.11.0
  latlong2: 0.10.1
  lucide_icons_flutter: 4.0.2
  riverpod_annotation: 4.0.2
  url_launcher: 6.3.3
  google_maps_flutter: 2.18.1
  shared_preferences: 2.5.3
  web_socket_channel: 3.0.3
  flutter_local_notifications: 18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.15.1
  flutter_launcher_icons: 0.14.4
  flutter_lints: ^6.0.0
  freezed: 3.2.5
  json_serializable: 6.13.0
  riverpod_generator: 4.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F8FAFC"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#F8FAFC"
    theme_color: "#1E40AF"
